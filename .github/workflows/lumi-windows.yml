name: LUMI Windows test build
on:
  push:
    branches: [lumi-practice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:practice
      - run: npm run test:pace
      - run: npm run test:keyboard
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Pianly-LUMI-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

